<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dự án ma</title>
<meta name="theme-color" content="#f5fbf8">
<meta name="description" content="Ghi chú + lịch để lên kế hoạch đi chơi cùng Bông">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dự án ma">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --mint:#a8e6cf; --mint-soft:#dcf5ea; --mint-deep:#2f9c78; --mint-ink:#1f6e54;
  --peach:#ffcfa8; --peach-soft:#ffe8d6; --peach-deep:#ee8a4f;
  --bg:#f5fbf8; --bg2:#eef8f3; --card:#ffffff; --card2:#f8fcfa;
  --text:#2b3a40; --muted:#6f8189; --line:#e3efe9; --shadow:0 6px 22px rgba(47,110,84,.10);
  --danger:#e5677a; --warn:#f2b34b; --ok:#3fbf8e;
  --r-lg:26px; --r:18px; --r-sm:12px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --font:'Nunito',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
html[data-theme="dark"]{
  --mint:#5fbf98; --mint-soft:#1f3a31; --mint-deep:#7fd8b3; --mint-ink:#a9ecd0;
  --peach:#e59a6a; --peach-soft:#3a2b22; --peach-deep:#ffb486;
  --bg:#121a17; --bg2:#17221e; --card:#1c2824; --card2:#21302b;
  --text:#e4f1eb; --muted:#94a9a1; --line:#2a3b35; --shadow:0 6px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45}
body{overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--mint-deep)}
img{max-width:100%}
[hidden]{display:none!important}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.7}
#app{position:relative;z-index:1;display:flex;min-height:100%}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#view{flex:1;padding:6px 16px calc(96px + var(--safe-b));max-width:1100px;width:100%;margin:0 auto}
.boot{text-align:center;padding:30vh 0;font-size:22px;font-weight:800;color:var(--mint-deep)}

/* ---------- Header ---------- */
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-t)) 16px 10px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#top .ttl{flex:1;min-width:0;font-weight:900;font-size:21px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .ttl small{font-weight:700;font-size:12px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);flex:none;font-size:18px}
.icon-btn svg{width:20px;height:20px}
.sync-dot{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.sync-dot i{width:11px;height:11px;border-radius:50%;background:#b8c5c0;display:block;transition:.3s}
.sync-dot[data-s="ok"] i{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.sync-dot[data-s="syncing"] i,.sync-dot[data-s="pending"] i{background:var(--warn);animation:pulse 1s infinite}
.sync-dot[data-s="error"] i{background:var(--danger)}
.sync-dot[data-s="offline"] i{background:#9aa7a2}
@keyframes pulse{50%{transform:scale(.6);opacity:.6}}

/* ---------- Nav ---------- */
#tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe-b));z-index:30;display:flex;justify-content:space-around;
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:24px;box-shadow:0 10px 30px rgba(47,110,84,.18);padding:6px;max-width:520px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:18px;color:var(--muted);font-size:11px;font-weight:800;transition:.2s}
.tab svg{width:23px;height:23px}
.tab.on{background:var(--mint-soft);color:var(--mint-ink)}
#side{display:none}
@media (min-width:900px){
  #tabs{display:none}
  #side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;width:230px;flex:none;padding:22px 14px;border-right:1px solid var(--line);background:var(--bg2)}
  #side .brand{font-weight:900;font-size:22px;padding:4px 10px 18px;display:flex;align-items:center;gap:8px}
  #side .tab{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:11px 14px;justify-content:flex-start}
  #view{padding-bottom:40px}
  #top .ttl{font-size:24px}
}

/* ---------- Cards & common ---------- */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;position:relative}
.card h3{margin:0 0 10px;font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
.card h3 .more{margin-left:auto;font-size:13px;color:var(--mint-deep);font-weight:800}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.sec-title{font-weight:900;font-size:18px;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-weight:700}
.empty .big{font-size:42px;display:block;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:var(--card2);border:1.5px solid var(--line);font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--mint-soft);border-color:var(--mint);color:var(--mint-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--peach-soft);color:var(--peach-deep);font-size:12px;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:16px;font-weight:900;background:var(--mint);color:#154a39;box-shadow:0 4px 0 color-mix(in srgb,var(--mint) 60%,#2f9c78);transition:transform .1s}
html[data-theme="dark"] .btn{color:#0e2b22}
html[data-theme="dark"] .btn.ghost{color:var(--text)}
html[data-theme="dark"] .btn.danger{color:var(--danger)}
html[data-theme="dark"] .btn.peach{color:#3d1d08}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.peach{background:var(--peach);color:#6b3412;box-shadow:0 4px 0 color-mix(in srgb,var(--peach) 60%,#c96a33)}
.btn.ghost{background:var(--card2);color:var(--text);box-shadow:none;border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:none;border:1.5px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:12px}
.btn.block{width:100%}
.fab-add{position:fixed;right:18px;bottom:calc(96px + var(--safe-b));z-index:25;width:56px;height:56px;border-radius:20px;background:var(--peach);color:#6b3412;font-size:30px;font-weight:900;box-shadow:0 8px 20px rgba(238,138,79,.4);display:grid;place-items:center}
@media (min-width:900px){.fab-add{bottom:28px;right:28px}}
.bar{height:10px;border-radius:999px;background:var(--mint-soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--mint),var(--mint-deep));transition:width .5s}
.bar.over>i{background:linear-gradient(90deg,var(--peach),var(--danger))}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--line)}
.list-item:last-child{border-bottom:0}
.emo{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--mint-soft)}
.seg{display:flex;background:var(--card2);border-radius:16px;padding:4px;gap:4px;border:1.5px solid var(--line);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:8px 10px;border-radius:12px;font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--mint-ink);box-shadow:var(--shadow)}

/* ---------- Forms ---------- */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:0 0 5px 4px}
.inp,.field input:not([type=checkbox]):not([type=color]),.field select,.field textarea{width:100%;padding:12px 14px;border-radius:15px;border:2px solid var(--line);background:var(--card2);outline:none;transition:.2s;font-size:16px}
.field textarea{min-height:90px;resize:vertical}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--mint);background:var(--card)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;font-weight:800}
.switch input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:none;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.2s}
.switch input:checked{background:var(--mint-deep)}
.switch input:checked::after{left:23px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:32px;height:32px;border-radius:12px;border:3px solid transparent}
.swatch.on{border-color:var(--text)}
.emoji-pick{display:flex;gap:6px;flex-wrap:wrap}
.emoji-pick button{width:40px;height:40px;border-radius:12px;background:var(--card2);font-size:20px;border:2px solid transparent}
.emoji-pick button.on{border-color:var(--mint-deep);background:var(--mint-soft)}

/* ---------- Sheet / modal ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(20,40,32,.35);opacity:0;transition:.25s}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:8px 18px calc(20px + var(--safe-b));
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1.1)}
.sheet.wide{max-width:760px}
.sheet-wrap.show .sheet-bg{opacity:1}
.sheet-wrap.show .sheet{transform:none}
.sheet-grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin:2px 0 14px;font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto}
.sheet .actions{display:flex;gap:10px;margin-top:14px;position:sticky;bottom:calc(-20px - var(--safe-b));background:var(--bg);padding:10px 0}
.sheet .actions .btn{flex:1}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:28px;max-height:86vh;transform:translateY(30px) scale(.97);opacity:0;transition:.22s}.sheet-wrap.show .sheet{opacity:1}}

#toasts{position:fixed;left:0;right:0;top:calc(14px + var(--safe-t));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:11px 18px;border-radius:16px;font-weight:800;font-size:14px;box-shadow:var(--shadow);animation:tin .25s;max-width:92vw}
.toast.err{background:var(--danger);color:#fff}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}

/* ---------- Home ---------- */
.hello{margin:6px 4px 14px}
.hello h1{margin:0;font-size:24px;font-weight:900}
.hello p{margin:2px 0 0;color:var(--muted);font-weight:700}
.widgets{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.widget,.trip-card{min-width:0}
@media (min-width:900px){.widgets{display:block;columns:2;column-gap:16px}.widget{break-inside:avoid;display:inline-block;width:100%}.widgets>.w-countdown,.widgets>.w-quick{column-span:all}}
.widget{position:relative}
.edit-layout .widget{animation:wiggle .35s infinite alternate;cursor:grab}
.edit-layout .widget.hiddenw{opacity:.45}
@keyframes wiggle{from{transform:rotate(-.4deg)}to{transform:rotate(.4deg)}}
.w-ctrl{position:absolute;top:-8px;right:-4px;display:flex;gap:6px;z-index:3}
.w-ctrl button{width:34px;height:34px;border-radius:12px;background:var(--card2);box-shadow:var(--shadow);font-size:16px}
.countdown{border-radius:var(--r-lg);padding:20px;color:#163f32;overflow:hidden;position:relative;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer;min-height:150px}
.countdown .cv-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35}
.countdown>*{position:relative}
.countdown .lbl{font-weight:800;font-size:13px;opacity:.8}
.countdown .nm{font-weight:900;font-size:22px;margin:2px 0}
.countdown .nums{display:flex;gap:10px;margin-top:12px}
.countdown .nums div{background:rgba(255,255,255,.65);border-radius:16px;padding:8px 10px;text-align:center;min-width:62px}
.countdown .nums b{display:block;font-size:24px;font-weight:900;line-height:1.1}
.countdown .nums small{font-size:11px;font-weight:800;opacity:.7}
.countdown .big-emo{position:absolute;right:14px;top:10px;font-size:58px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quick button{background:var(--card);border-radius:20px;padding:12px 4px;box-shadow:var(--shadow);font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.quick button span{font-size:24px}
.wx-days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.wx-day{flex:none;min-width:70px;text-align:center;background:var(--card2);border-radius:16px;padding:8px 6px;font-weight:800;font-size:12px;border:1.5px solid var(--line)}
.wx-day.trip{border-color:var(--peach);background:var(--peach-soft)}
.wx-day .e{font-size:24px;display:block}
.photo-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.photo-strip img{width:92px;height:92px;object-fit:cover;border-radius:16px;flex:none;background:var(--mint-soft)}

/* ---------- Calendar ---------- */
.cal-head{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.cal-head .m{flex:1;font-weight:900;font-size:20px;text-align:center}
.cal{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:10px 8px 6px;overflow:hidden}
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12px;font-weight:900;color:var(--muted);padding-bottom:6px}
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:min-content;position:relative;min-height:74px;border-top:1px solid var(--line)}
.cal-day{grid-row:1/span 10;display:flex;flex-direction:column;align-items:center;padding-top:4px;cursor:pointer;border-radius:12px;min-height:74px;position:relative}
.cal-day .n{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px}
.cal-day.out .n{opacity:.35}
.cal-day.today .n{background:var(--peach);color:#6b3412}
.cal-day.sel{background:var(--mint-soft)}
.cal-day .dots{position:absolute;top:32px;display:flex;gap:3px}
.cal-day .dots i{width:6px;height:6px;border-radius:50%}
.cal-bar{grid-row:auto;height:16px;margin:1px 2px;border-radius:7px;font-size:10px;font-weight:900;line-height:16px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#183c30;pointer-events:none;z-index:1;align-self:start}
.cal-bar.cl{border-top-left-radius:2px;border-bottom-left-radius:2px;margin-left:0}
.cal-bar.cr{border-top-right-radius:2px;border-bottom-right-radius:2px;margin-right:0}
.cal-spacer{grid-column:1/-1;height:40px;grid-row:1}
.agenda-item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer}
.agenda-item .clr{width:6px;align-self:stretch;border-radius:9px}
.agenda-item .tm{font-weight:900;font-size:13px;color:var(--mint-deep);min-width:44px}

/* ---------- Trips ---------- */
.trip-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:640px){.trip-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.trip-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.trip-card{border-radius:var(--r-lg);overflow:hidden;background:var(--card);box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.trip-card:active{transform:scale(.98)}
.cover{height:120px;position:relative;display:grid;place-items:center;font-size:54px;background-size:cover;background-position:center}
.cover .badge{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.85);color:#2b3a40;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:900}
.trip-card .body{padding:12px 14px 14px}
.trip-card .nm{font-weight:900;font-size:17px}
.trip-hero{border-radius:var(--r-lg);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow);background:var(--card)}
.trip-hero .cover{height:170px;font-size:72px}
.trip-hero .info{padding:12px 16px 14px}
.trip-hero h1{margin:0;font-size:24px;font-weight:900}
.tabs2{position:sticky;top:calc(60px + var(--safe-t));z-index:10;margin:0 -4px 12px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);padding:4px}
.day-card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.day-card .dh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.day-card .dh b{font-size:16px;font-weight:900}
.day-card .dh .num{background:var(--mint);color:#154a39;border-radius:10px;padding:2px 9px;font-weight:900;font-size:13px}
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--mint-soft)}
.tl-item{position:relative;display:flex;gap:10px;align-items:flex-start;padding:8px 6px 8px 4px;border-radius:14px;background:var(--card)}
.tl-item::before{content:"";position:absolute;left:-17px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--card);border:3px solid var(--mint-deep)}
.tl-item .t{font-weight:900;color:var(--mint-deep);font-size:13px;min-width:42px;padding-top:1px}
.tl-item .ti{font-weight:800}
.handle{width:28px;height:28px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;flex:none;font-size:16px;letter-spacing:-2px}
.dragging{opacity:.95;box-shadow:0 14px 30px rgba(0,0,0,.18)!important;z-index:50;position:relative;transform:scale(1.02)}
.drag-ph{border:2px dashed var(--mint);border-radius:16px;background:var(--mint-soft);opacity:.6}
.chk{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line)}
.chk input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2.5px solid var(--mint);flex:none;margin:0;display:grid;place-items:center;transition:.15s;background:var(--card)}
.chk input:checked{background:var(--mint-deep);border-color:var(--mint-deep)}
.chk input:checked::after{content:"✓";color:#fff;font-weight:900;font-size:15px}
.chk.done .tx{text-decoration:line-through;color:var(--muted)}
.chk .tx{flex:1;font-weight:700}
.exp-cat{display:flex;align-items:center;gap:10px;margin:10px 0}
.exp-cat .ic{font-size:20px;width:34px;text-align:center}
.money-big{font-size:28px;font-weight:900}

/* ---------- Notes ---------- */
.notes-grid{columns:2 160px;column-gap:12px}
.note-card{break-inside:avoid;background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;border-top:6px solid var(--mint)}
.note-card .t{font-weight:900;margin-bottom:4px}
.note-card .b{font-size:14px;color:var(--muted);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.search{position:relative;margin-bottom:10px}
.search input{padding-left:42px!important}
.search::before{content:"🔍";position:absolute;left:14px;top:11px;font-size:16px}

/* ---------- Map / places ---------- */
.map{height:260px;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px;background:var(--mint-soft);z-index:0}
.leaflet-container{font-family:var(--font)!important}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.pin span{transform:rotate(45deg);font-size:14px}
html[data-theme="dark"] .leaflet-tile-pane{filter:brightness(.75) contrast(1.1) saturate(.8)}

/* ---------- Album ---------- */
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (min-width:700px){.ph-grid{grid-template-columns:repeat(5,1fr)}}
.ph-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;cursor:pointer;background:var(--mint-soft)}
.lightbox{position:fixed;inset:0;z-index:55;background:rgba(10,20,16,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.lightbox img{max-width:96vw;max-height:76vh;border-radius:16px;object-fit:contain}
.lightbox .lb-bar{display:flex;gap:10px;margin-top:14px;align-items:center}
.lightbox .lb-close{position:absolute;top:calc(14px + var(--safe-t));right:14px}
.lightbox .icon-btn{background:rgba(255,255,255,.15);color:#fff}

/* ---------- Bông ---------- */
#bong{position:fixed;z-index:40;width:66px;height:66px;border-radius:50%;background:var(--card);box-shadow:0 10px 26px rgba(47,110,84,.28);right:16px;bottom:calc(98px + var(--safe-b));touch-action:none;display:grid;place-items:center;padding:0;transition:box-shadow .2s}
#bong svg{width:62px;height:62px;animation:bob 3s ease-in-out infinite}
#bong.drag{box-shadow:0 16px 36px rgba(47,110,84,.4);transform:scale(1.08)}
@keyframes bob{50%{transform:translateY(-3px) rotate(-2deg)}}
@media (min-width:900px){#bong{bottom:96px;right:26px}}
.chat{display:flex;flex-direction:column;height:min(78vh,680px)}
.chat-log{flex:1;overflow:auto;padding:4px 2px 10px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:20px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--mint);color:#154a39;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.msg.bot ul{margin:4px 0;padding-left:20px}
.msg-row{display:flex;gap:8px;align-items:flex-end}
.msg-row .av{width:34px;height:34px;flex:none}
.act-card{align-self:stretch;margin-left:42px;background:var(--peach-soft);border:2px dashed var(--peach);border-radius:18px;padding:10px 12px}
.act-card .h{font-weight:900;font-size:14px;margin-bottom:4px}
.act-card ul{margin:4px 0 8px;padding-left:18px;font-size:13px}
.chat-in{display:flex;gap:8px;padding-top:8px}
.chat-in textarea{flex:1;resize:none;height:46px;max-height:120px;border-radius:16px;border:2px solid var(--line);background:var(--card2);padding:11px 14px;outline:none}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:pulse 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}

/* ---------- Lock ---------- */
#lock{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,var(--mint-soft),var(--peach-soft));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#lock .pdots{display:flex;gap:12px;margin:6px 0 10px}
#lock .pdots i{width:15px;height:15px;border-radius:50%;border:2.5px solid var(--mint-deep)}
#lock .pdots i.f{background:var(--mint-deep)}
#lock .pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px}
#lock .pad button{height:74px;border-radius:26px;background:var(--card);font-size:26px;font-weight:900;box-shadow:var(--shadow)}
#lock .shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

/* ---------- Wrapped ---------- */
.wrapped{position:fixed;inset:0;z-index:85;display:flex;flex-direction:column;color:#20332c;overflow:hidden}
.wrapped .prog{display:flex;gap:4px;padding:calc(12px + var(--safe-t)) 14px 0}
.wrapped .prog i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.5);overflow:hidden}
.wrapped .prog i.on{background:#fff}
.wrapped .slide{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:pop .45s}
.wrapped .slide .k{font-size:clamp(64px,22vw,120px);font-weight:900;line-height:1}
.wrapped .slide h2{font-size:26px;margin:10px 0 6px;font-weight:900}
.wrapped .slide p{font-size:17px;font-weight:700;max-width:420px;opacity:.85}
.wrapped .wclose{position:absolute;top:calc(26px + var(--safe-t));right:14px;z-index:2}
@keyframes pop{from{transform:scale(.92);opacity:0}}

/* ---------- Settings ---------- */
.set-group{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:6px 16px;margin-bottom:14px}
.set-group h4{margin:12px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.set-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line);font-weight:800}
.set-row:last-child{border-bottom:0}
.set-row .grow small{display:block;font-weight:700;color:var(--muted);font-size:12px}
.set-row select{border:2px solid var(--line);background:var(--card2);border-radius:12px;padding:7px 10px;font-weight:800}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrapped .icon-btn{background:rgba(255,255,255,.75);color:#20332c}

</style>
</head>
